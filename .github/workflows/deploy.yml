name: Deploy

# Builds on every pull request so a break is caught before merge, and
# publishes to Cloudflare Pages from main.
#
# The build deliberately stays in GitHub Actions rather than using Pages'
# native Git integration. Pages would build the site itself and publish it
# without the checks in this file or in public-boundary.yml ever running —
# so the guards would exist but would not gate anything. Building here and
# publishing with wrangler keeps them in the path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The boundary check also runs on its own, but as a separate workflow it
  # only reports: a merge that failed it was published all the same, while
  # the check went red next to the deploy. Calling it here puts it in the
  # path, so `publish` cannot start unless it passed.
  boundary:
    uses: ./.github/workflows/public-boundary.yml
    secrets:
      PRIVATE_IDENTIFIERS: ${{ secrets.PRIVATE_IDENTIFIERS }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Check the export is real
        # `next build` can succeed and still emit nothing useful if the export
        # config is wrong. Publishing an empty directory over a working site is
        # the failure this prevents.
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          grep -q "SwornMail" out/index.html || { echo "::error::out/index.html has no content"; exit 1; }
          test -f out/_headers || { echo "::error::_headers did not ship; the site would serve with no CSP"; exit 1; }
          echo "index.html: $(wc -c < out/index.html) bytes"

      - name: Check no external requests crept in
        # The site's credibility argument includes making no third-party
        # requests. A stray font or analytics import should fail the build,
        # not be discovered by a reader. This site has five pages, not one, so
        # the check has to walk every exported HTML file — checking only
        # index.html would let a reference on /deploy/, /records/, /verify/ or
        # /implementations/ ship green.
        run: |
          # The old form of this check matched only src="https://…" and
          # href="https://…", then waved through any allowlisted domain. A
          # font in a stylesheet's url(), an @import, a srcset entry, a
          # protocol-relative //host reference or a script on an allowlisted
          # host all passed. The rule now is by kind, not by domain: a
          # reference the browser FETCHES must be same-origin, written
          # root-relative or as a data: URL; a reference the reader FOLLOWS
          # may point anywhere. So the only places an off-site URL may appear
          # are the href of an <a>, the href of <link rel="canonical"> and the
          # content of a <meta>. Any other attribute of any tag, and every
          # url(), @import and image-set() in exported CSS, <style> blocks and
          # style attributes, fails the build.
          #
          # This catches drift, not obfuscation: it reads the export as text
          # and does not decode entities or run scripts. The CSP in _headers
          # is what holds in the browser; this is what stops the page and the
          # CSP from disagreeing in the first place.
          set -euo pipefail

          # An authority (//host) or a scheme that fetches.
          ext='//|(https?|ftp|wss?):'
          val="(\"[^\"]*\"|'[^']*'|[^[:space:]>]*)"

          # grep exits 1 for "no match", the good outcome, and 2 when it could
          # not scan. Only the first may pass: every pipeline below runs under
          # pipefail, so a scanner that breaks fails the step instead of
          # reporting a clean export.
          quiet() { "$@" || [ "$?" -eq 1 ]; }

          # One line per tag, lowercased: "name attributes>text that follows".
          split() { tr '\n\r\t' '   ' < "$1" | tr 'A-Z' 'a-z' | tr '<' '\n'; }

          # Each tag with its text dropped and the navigation-only attributes
          # removed. Whatever is left must not point off-site. A tag that does
          # not parse is kept whole, so it is judged with its text included.
          markup() {
            split "$1" | quiet grep -a -E '^[a-z]' | quiet grep -a -vE '^style[[:space:]>]' \
              | sed -E \
                  -e "s/^(([^>\"']|\"[^\"]*\"|'[^']*')*)>.*\$/\\1/" \
                  -e "/^a[[:space:]]/s/[[:space:]]href=$val//" \
                  -e "/^meta[[:space:]]/s/[[:space:]]content=$val//" \
                  -e "/^link([[:space:]].*)?[[:space:]]rel=\"canonical\"/{" \
                  -e "/rel=.*rel=/!s/[[:space:]]href=$val//" \
                  -e "}" \
                  -e 's#[[:space:]]xmlns(:[a-z]+)?="http://www\.w3\.org/[a-z0-9/]*"##g' \
              | quiet grep -a -E "$ext"
          }

          # Lowercased CSS on stdin. data: URLs are inline, not requests.
          styles() {
            quiet grep -a -oE 'url\([^)]*\)|@import[^;]*|image-set\([^;}]*' \
              | quiet grep -a -vE "^url\([[:space:]]*[\"']?data:" \
              | quiet grep -a -E "$ext"
          }

          # Prints one line per off-site resource reference under $1.
          scan() {
            local f
            find "$1" -type f \( -name '*.html' -o -name '*.svg' \) -print0 > "$work/markup"
            find "$1" -type f -name '*.css' -print0 > "$work/css"
            while IFS= read -r -d '' f; do
              markup "$f" | sed "s|^|$f: <|"
              split "$f" | quiet grep -a -E '^style[[:space:]>]' | styles | sed "s|^|$f: |"
            done < "$work/markup"
            while IFS= read -r -d '' f; do
              tr '\n\r\t' '   ' < "$f" | tr 'A-Z' 'a-z' | styles | sed "s|^|$f: |"
            done < "$work/css"
          }

          work=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/same-origin.XXXXXX")

          # Self-test. Eight planted violations, one per line, next to the
          # forms that must stay legal. If the scanner does not report exactly
          # the eight, it is blind or over-eager on this runner and nothing it
          # says about out/ can be believed.
          mkdir "$work/canary"
          printf '%s\n' \
            '<script src="https://cdn.example/a.js"></script>' \
            '<link rel="stylesheet" href="//fonts.example/a.css">' \
            '<img src="/a.png" srcset="/a.png 1x, https://img.example/a.png 2x">' \
            '<p style="background:url(https://img.example/b.png)">text</p>' \
            '<style>@import "https://fonts.example/c.css";</style>' \
            '<style>@font-face{src:url(https://fonts.example/f.woff2)}</style>' \
            '<a href="https://example.org/">a link out is navigation</a>' \
            '<link rel="canonical" href="https://example.org/">' \
            '<meta property="og:url" content="https://example.org/">' \
            '<link rel="icon" href="/favicon.svg"><script src="/a.js"></script>' \
            > "$work/canary/c.html"
          printf '%s\n' \
            '@import url(//fonts.example/d.css);' \
            'a{background:url("https://img.example/e.png")}' \
            'b{background:url(data:image/png;base64,AA==);src:url(/f.woff2)}' \
            > "$work/canary/c.css"
          scan "$work/canary" > "$work/canary.hits"
          seen=$(($(wc -l < "$work/canary.hits")))
          if [ "$seen" -ne 8 ]; then
            echo "::error::scanner self-test planted 8 violations and saw $seen; refusing to pass an export it cannot read"
            cat "$work/canary.hits"
            exit 1
          fi

          scan out > "$work/hits"
          pages=$(($(tr -cd '\0' < "$work/markup" | wc -c)))
          sheets=$(($(tr -cd '\0' < "$work/css" | wc -c)))
          if [ "$pages" -eq 0 ] || [ "$sheets" -eq 0 ]; then
            echo "::error::found $pages pages and $sheets stylesheets in out/; nothing was checked"
            exit 1
          fi
          if [ -s "$work/hits" ]; then
            echo "::error::the export loads a resource from another origin"
            cat "$work/hits"
            exit 1
          fi
          echo "no off-site resource references in $pages pages and $sheets stylesheets"

      - name: Check no local tooling state leaked into the export
        # A manual `wrangler pages deploy out` run from this working copy
        # would publish whatever sits in out/, dot-directories included —
        # wrangler is not relied on to filter this out, because that behaviour
        # was never confirmed. CI always builds out/ fresh from a clean
        # checkout, so this should never fire here; it exists to catch a
        # stale or locally-built out/ before it ships.
        run: |
          if find out -mindepth 1 -name '.*' | grep -q .; then
            echo "::error::out/ contains a dotfile or dot-directory; a local build likely leaked tooling state (e.g. .omc/) into the export"
            find out -mindepth 1 -name '.*'
            exit 1
          fi
          echo "no dotfiles in the export"

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7

  publish:
    needs: [build, boundary]
    # The credential check lives in the steps below, not here. A job-level
    # `if` can read `vars` but not `secrets`, and both Cloudflare values are
    # secrets so that neither prints in the public run logs. Gating on a
    # variable that no longer exists would skip every publish, silently.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      # The `secrets` context is not available in an `if`, at job or step
      # level. Mapping it to env vars here is what makes the guards below
      # possible; `env` is available in a step-level condition.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out

      - name: Publish to Cloudflare Pages
        # A half-configured repository skips the publish rather than failing a
        # run for a reason that is not a defect.
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=swornmail-dev --branch=main

      - name: Say so if nothing was published
        # A green run that silently published nothing is worse than a red one.
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set — the site was built and verified but NOT published."

