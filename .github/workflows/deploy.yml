name: Deploy

# Builds on every pull request so a break is caught before merge, and
# publishes to Cloudflare Pages from main.
#
# The build deliberately stays in GitHub Actions rather than using Pages'
# native Git integration. Pages would build the site itself and publish it
# without the checks in this file or in public-boundary.yml ever running —
# so the guards would exist but would not gate anything. Building here and
# publishing with wrangler keeps them in the path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Check the export is real
        # `next build` can succeed and still emit nothing useful if the export
        # config is wrong. Publishing an empty directory over a working site is
        # the failure this prevents.
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          grep -q "SwornMail" out/index.html || { echo "::error::out/index.html has no content"; exit 1; }
          test -f out/_headers || { echo "::error::_headers did not ship; the site would serve with no CSP"; exit 1; }
          echo "index.html: $(wc -c < out/index.html) bytes"

      - name: Check no external requests crept in
        # The site's credibility argument includes making no third-party
        # requests. A stray font or analytics import should fail the build,
        # not be discovered by a reader. This site has five pages, not one, so
        # the check has to walk every exported HTML file — checking only
        # index.html would let a reference on /deploy/, /records/, /verify/ or
        # /implementations/ ship green.
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if grep -oE '(src|href)="https?://[^"]*"' "$f" \
               | grep -vE 'github\.com|crates\.io|swornmail\.com|swornmail\.dev|w3\.org'; then
              echo "::error::$f references an external resource"
              fail=1
            fi
          done < <(find out -name '*.html' -print0)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "no external resource references, checked $(find out -name '*.html' | wc -l) pages"

      - name: Check no local tooling state leaked into the export
        # A manual `wrangler pages deploy out` run from this working copy
        # would publish whatever sits in out/, dot-directories included —
        # wrangler is not relied on to filter this out, because that behaviour
        # was never confirmed. CI always builds out/ fresh from a clean
        # checkout, so this should never fire here; it exists to catch a
        # stale or locally-built out/ before it ships.
        run: |
          if find out -mindepth 1 -name '.*' | grep -q .; then
            echo "::error::out/ contains a dotfile or dot-directory; a local build likely leaked tooling state (e.g. .omc/) into the export"
            find out -mindepth 1 -name '.*'
            exit 1
          fi
          echo "no dotfiles in the export"

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7

  publish:
    needs: build
    # The credential check lives in the steps below, not here. A job-level
    # `if` can read `vars` but not `secrets`, and both Cloudflare values are
    # secrets so that neither prints in the public run logs. Gating on a
    # variable that no longer exists would skip every publish, silently.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      # The `secrets` context is not available in an `if`, at job or step
      # level. Mapping it to env vars here is what makes the guards below
      # possible; `env` is available in a step-level condition.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out

      - name: Publish to Cloudflare Pages
        # A half-configured repository skips the publish rather than failing a
        # run for a reason that is not a defect.
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=swornmail-dev --branch=main

      - name: Say so if nothing was published
        # A green run that silently published nothing is worse than a red one.
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set — the site was built and verified but NOT published."

